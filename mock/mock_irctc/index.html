<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Rail Lab</title>
<style>body{font:17px system-ui;background:#eef3f8;color:#172d45;margin:0}main{max-width:900px;margin:45px auto;background:white;padding:32px;border-radius:18px}h1{margin-top:0}label{display:block;margin:14px 0}input,select,button{font:inherit;padding:9px;border:1px solid #a7b7c9;border-radius:6px}button{background:#104e80;color:white;cursor:pointer;margin:6px}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}.notice{padding:12px;background:#fff2cf}.error{color:#a01616}pre{white-space:pre-wrap}dialog{border:0;border-radius:12px;padding:24px}</style>
<main><h1>Local Rail Lab</h1><p class="notice">Fictional localhost simulator. Demo credentials: demo / demo. No real travel or money.</p><p id="error" role="alert" class="error"></p><section id="view"></section></main>
<dialog id="popup"><h2>Travel tips</h2><p>This popup tests landmark-based recovery.</p><button onclick="document.querySelector('dialog').close()">Dismiss travel tips</button></dialog>
<script>
const variant=__VARIANT__, popup=__POPUP__; let ctx=JSON.parse(sessionStorage.getItem('lab')||'{}');
const view=document.querySelector('#view'); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){sessionStorage.setItem('lab',JSON.stringify(ctx))}
async function api(path,data){document.querySelector('#error').textContent='';const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const d=await r.json();if(!r.ok){document.querySelector('#error').textContent=d.detail;throw Error(d.detail)}return d}
function field(label,name,value='',type='text'){return `<label>${label} <input id="field-${variant}-${name}" name="${name}" type="${type}" value="${esc(value)}" required></label>`}
function form(html,handler){view.innerHTML=html;view.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await handler(Object.fromEntries(new FormData(e.target)))}catch{}}}
async function login(){const challenge=await api('captcha');form(`<h2>Sign in</h2><form>${field('Username','username','demo')}${field('Password','password','','password')}<div role="img" aria-label="Captcha challenge TRAIN">${challenge.svg}</div>${field('Captcha answer','captcha')}<button>Sign in to rail lab</button></form>`,async d=>{await api('login',d);search()})}
function search(){form(`<h2>Find trains</h2><form>${field('Origin station code','origin','RK')}${field('Destination station code','destination','HW')}${field('Journey date','date','2026-10-26','date')}<label>Quota <select name="quota" aria-label="Quota"><option>TATKAL</option><option>GENERAL</option></select></label><button>Search trains</button></form>`,async d=>{ctx.search=d;const result=await api('search',d);ctx.trains=result.trains;save();results(result)});if(popup)document.querySelector('dialog').showModal()}
function results(result){view.innerHTML=`<h2>Train results</h2><p>Window ${result.open?'open':'closed'}. Compare total fares; only AVL is confirmed.</p><table><thead><tr><th>Train</th><th>Class</th><th>Departure</th><th>Total fare</th><th>Availability</th><th>Action</th></tr></thead><tbody>${result.trains.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.class}</td><td>${t.departure}</td><td>Rs ${t.total_fare}</td><td>${t.availability}</td><td><button data-train="${t.id}" ${t.availability!=='AVL'?'disabled':''}>Select ${esc(t.name)}</button></td></tr>`).join('')}</tbody></table><button id="retry">Refresh results</button>`;view.querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>{ctx.train=b.dataset.train;save();passenger()});document.querySelector('#retry').onclick=async()=>{try{results(await api('search',ctx.search))}catch{}}}
function passenger(){form(`<h2>Passenger details</h2><form>${field('Passenger name','name')}${field('Passenger age','age','','number')}<label>Gender <select name="gender" aria-label="Gender"><option>Female</option><option>Male</option><option>Other</option></select></label>${field('Nationality','nationality','Indian')}${field('Mobile number','mobile')}<button>Continue to review</button></form>`,async p=>{ctx.profile=p;ctx.key=ctx.key||crypto.randomUUID();const d=await api('passenger',{profile:p,train_id:ctx.train,date:ctx.search.date,idempotency_key:ctx.key});ctx.review=d.review;ctx.digest=d.digest;save();review()})}
function review(){view.innerHTML=`<h2>Review journey before payment</h2><pre>${esc(JSON.stringify(ctx.review,null,2))}</pre><p>Verify passenger, ${esc(ctx.review.origin)} to ${esc(ctx.review.destination)}, date, ${esc(ctx.review.quota)}, train, class and total fare.</p><button id="verify">Verify review and request test payment</button>`;document.querySelector('#verify').onclick=async()=>{try{await api('review/'+ctx.key,{expected:ctx.review,digest:ctx.digest});await api('payment/'+ctx.key,{digest:ctx.digest});payment()}catch{}}}
function payment(){view.innerHTML=`<h2>External payment approval required</h2><p>One handoff: approve the fictional request through the test approval endpoint.</p><svg role="img" aria-label="Fictional payment image" width="240" height="120" xmlns="http://www.w3.org/2000/svg"><rect width="240" height="120" fill="white" stroke="black"/><text x="18" y="40" font-size="16">LOCAL TEST IMAGE</text><text x="18" y="75" font-size="18">NOT PAYABLE</text></svg><p>This fixture is not a payment QR and cannot move money.</p><p>Reservation: <code>${esc(ctx.key)}</code></p><button id="check">Check payment status</button>`;document.querySelector('#check').onclick=check;async function check(){try{const d=await api('ticket/'+ctx.key);if(d.status==='booked'){view.innerHTML=`<h2>Ticket confirmed</h2><p>PNR: <strong>${esc(d.ticket.pnr)}</strong></p><pre>${esc(JSON.stringify(d.ticket,null,2))}</pre>`}else if(d.status==='expired'){view.innerHTML='<h2>Payment expired</h2><p>Stopped cleanly. No booking made.</p>'}}catch{}}}
login();
</script></html>
