[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-computer-harness"
version = "0.1.0"
description = "A general-purpose, resumable computer-use agent taught through skills"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "httpx>=0.28,<1", "playwright>=1.48,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "croniter>=6,<7", "psutil>=6,<8", "python-dotenv>=1,<2", "tzdata>=2025.2", "pypdf>=5,<7", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
desktop = ["mss>=10,<11", "pyautogui>=0.9.54", "keyring>=25,<26"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
train-agent = "harness.cli:main"
train-gui = "harness.web.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*", "mock*"]

[tool.setuptools.package-data]
"mock.mock_irctc" = ["*.html"]
"harness.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
